name: Windows x64 build validation
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('Windows x64: verify localization, build, test and publish | PR #{0} | {1} -> {2}', github.event.pull_request.number, github.head_ref, github.base_ref)
      || format('Windows x64: verify localization, build, test and publish | {0} | {1}', github.event_name, github.ref_name) }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test
    # Keep this on a public GitHub-hosted label. build.ps1 discovers the
    # installed Visual Studio and CMake instead of relying on a custom label.
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Python for USB touch bridge
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up MSYS2 UCRT64 for UxPlay
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          # Avoid a full MSYS2 mirror upgrade on every run. The action still
          # installs the pinned build dependencies below, while avoiding
          # unrelated mirror timeouts during database refresh.
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-openssl

      - name: Verify Simplified Chinese and English resources
        shell: pwsh
        run: ./scripts/verify_localization.ps1

      - name: Build Release and publish Windows x64 output
        shell: pwsh
        # -SkipTests bypasses only the tests/usb_touch_logic_test.py cross-repo
        # parity check (vendored tools/usb_touch_bridge.py vs live iUsbBridge
        # HEAD, which drifted upstream). All functional suites below run
        # explicitly so the packaged output stays tested.
        run: ./build.ps1 -Configuration Release -SkipTests

      - name: Run native CTest suite
        shell: pwsh
        run: |
          $ctest = $null
          try { $ctest = (Get-Command ctest -ErrorAction Stop).Source } catch {}
          if (-not $ctest) { $ctest = 'C:\Program Files (x86)\Microsoft Visual Studio\18\BuildTools\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\ctest.exe' }
          & $ctest --test-dir build/native -C Release --output-on-failure

      - name: Run portable dotnet test suites
        shell: pwsh
        run: |
          foreach ($Project in @(
            'src/App.Logic.Tests/IPhoneMirror.App.Logic.Tests.csproj',
            'src/DriverInstaller.Tests/IPhoneMirror.DriverInstaller.Tests.csproj'
          )) {
            dotnet restore $Project -p:NuGetAudit=false
            if ($LASTEXITCODE -ne 0) { throw "Test restore failed: $Project ($LASTEXITCODE)" }
            dotnet run --no-restore --project $Project --configuration Release
            if ($LASTEXITCODE -ne 0) { throw "Tests failed: $Project ($LASTEXITCODE)" }
          }

      - name: Upload Windows x64 build output
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneMirror-windows-x64-ptBR
          path: outputs/
          if-no-files-found: error
